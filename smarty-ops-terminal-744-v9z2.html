<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smarty91 Operations Console</title>
    <link rel="icon" type="image/png" href="https://plain-apac-prod-public.komododecks.com/202608/30/R5mYT3Hlk72jXCVLqTOb/image.png" />
    <link rel="apple-touch-icon" href="https://plain-apac-prod-public.komododecks.com/202608/30/R5mYT3Hlk72jXCVLqTOb/image.png" />
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #131b2e;
            --bg-input: #172238;
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-violet: #8b5cf6;
            --accent-blue: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #24324f;
        }

        .help-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            background: rgba(245, 158, 11, 0.2);
            color: var(--primary);
            border: 1px solid rgba(245, 158, 11, 0.4);
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            margin-left: 6px;
            transition: all 0.2s ease;
        }
        .help-btn:hover {
            background: var(--primary);
            color: #000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .admin-header {
            background: #101728;
            border-bottom: 1px solid var(--border-color);
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            border: 1.5px solid var(--primary);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .brand-text-container {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 13px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.1;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-view-game {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .btn-view-game:hover {
            background: #334155;
            color: #fff;
        }

        /* Responsive Header Tweaks */
        @media (max-width: 480px) {
            .brand-subtitle {
                display: none;
            }
            .header-brand span {
                display: none !important; /* Hide Firestore Live badge text on tiny screens */
            }
            .admin-header {
                padding: 5px 8px;
            }
            .btn-view-game span {
                margin-right: 0;
            }
            #admin-sound-toggle-btn #sound-status-text {
                display: none; /* Hide toggle text on mobile, just show bell */
            }
            #admin-sound-toggle-btn {
                padding: 4px 6px !important;
            }
        }

        /* Collapsible Navigation Drawer Sidebar & Layout wrapper */
        .admin-layout-wrapper {
            display: flex;
            min-height: calc(100vh - 41px);
            width: 100%;
            position: relative;
        }

        .admin-nav {
            background: #101728;
            border-right: 1px solid var(--border-color);
            border-top: none;
            position: fixed;
            top: 41px;
            bottom: 0;
            left: 0;
            width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 12px 8px;
            z-index: 1000;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 4px;
        }

        /* Sidebar collapsed state */
        .admin-layout-wrapper.sidebar-collapsed .admin-nav {
            width: 60px;
        }

        .admin-layout-wrapper.sidebar-collapsed .admin-nav .nav-label {
            opacity: 0;
            width: 0;
            overflow: hidden;
            pointer-events: none;
            display: none;
        }

        .admin-layout-wrapper.sidebar-collapsed .admin-nav .nav-item {
            justify-content: center;
            padding: 8px 0;
        }

        .nav-item {
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            text-align: left;
            box-sizing: border-box;
        }

        .nav-item.active {
            color: var(--primary);
            background: rgba(245, 158, 11, 0.12);
        }

        .nav-icon {
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 20px;
        }

        .nav-badge {
            position: absolute;
            top: -6px;
            right: -10px;
            background: #ef4444;
            color: #fff;
            font-size: 8px;
            font-weight: 900;
            padding: 1px 4px;
            border-radius: 3px;
            min-width: 14px;
            text-align: center;
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
            animation: pulseBadge 1.2s infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.85; }
        }

        .nav-label {
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        /* Adjust main container relative to sidebar */
        .admin-main {
            flex: 1;
            padding: 16px;
            margin-left: 200px;
            width: calc(100% - 200px);
            max-width: 1200px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        .admin-layout-wrapper.sidebar-collapsed .admin-main {
            margin-left: 60px;
            width: calc(100% - 60px);
        }

        /* Drawer Overlay */
        .drawer-overlay {
            position: fixed;
            top: 41px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .drawer-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Mobile Viewports */
        @media (max-width: 768px) {
            .admin-nav {
                transform: translateX(-100%);
                border-right: 1px solid var(--border-color);
            }
            .admin-nav.open {
                transform: translateX(0);
                box-shadow: 10px 0 30px rgba(0,0,0,0.6);
            }
            .admin-main {
                margin-left: 0;
                width: 100%;
                padding: 12px;
            }
            .admin-layout-wrapper.sidebar-collapsed .admin-main {
                margin-left: 0;
                width: 100%;
            }
        }
        .alarm-banner {
            background: linear-gradient(90deg, #dc2626, #b91c1c);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            box-shadow: 0 2px 10px rgba(220, 38, 38, 0.3);
            animation: flashBanner 1s infinite alternate;
        }

        @keyframes flashBanner {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.25); }
        }

        .btn-copy-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #38bdf8;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-copy-chip:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        /* KPI Metric Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        @media (min-width: 600px) {
            .kpi-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .kpi-label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .kpi-value {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
        }

        /* Mode Selector Chips */
        .mode-chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }

        .mode-chip {
            flex: 1;
            min-width: 75px;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 7px 4px;
            border-radius: 4px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .mode-chip.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        /* Section Cards */
        .admin-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 12.5px;
            font-weight: 800;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Number Outcome Matrix (0-9) */
        .number-matrix {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 10px 0;
        }

        .num-btn {
            padding: 10px 0;
            font-size: 15px;
            font-weight: 800;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: #fff;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .num-btn:active {
            transform: scale(0.96);
        }

        .num-btn.selected {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
        }

        .num-btn[data-color="red"] { border-bottom: 3px solid var(--accent-red); }
        .num-btn[data-color="green"] { border-bottom: 3px solid var(--accent-green); }
        .num-btn[data-color="violet-red"] { border-bottom: 3px solid var(--accent-red); }
        .num-btn[data-color="violet-green"] { border-bottom: 3px solid var(--accent-green); }

        /* Form Inputs */
        .form-group {
            margin-bottom: 10px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .form-input, .form-select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            border: 1px solid var(--primary-dark);
            border-radius: 4px;
            padding: 8px 14px;
            font-weight: 800;
            font-size: 12px;
            width: 100%;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-primary:hover {
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 6px 12px;
            font-weight: 700;
            font-size: 11.5px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-secondary:hover {
            background: #334155;
        }

        /* Table view */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .admin-table th {
            text-align: left;
            padding: 7px 8px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
        }

        .admin-table td {
            padding: 7px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #f1f5f9;
        }

        /* Developer Portal Modal Styles */
        .dev-portal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 7, 13, 0.88);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .dev-portal-box {
            background: #0D131F;
            border: 1.5px solid #FF3B56;
            border-radius: 5px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 40px rgba(229, 24, 55, 0.3), 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .dev-portal-head {
            background: linear-gradient(135deg, #B80A22 0%, #E51837 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #FFFFFF;
        }

        .dev-portal-body {
            padding: 14px;
        }

        /* Auth Screen */
        #admin-auth-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Authentication Screen (Shown if PIN is not verified) -->
    <div id="admin-auth-screen">
        <div class="auth-card">
            <div style="margin: 0 auto 14px auto; width: 56px; height: 56px; border-radius: 50%; border: 2px solid #f59e0b; overflow: hidden; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);">
                <img src="https://plain-apac-prod-public.komododecks.com/202608/30/R5mYT3Hlk72jXCVLqTOb/image.png" alt="Smarty91" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;" />
            </div>
            <h2 style="font-size: 18px; color: #fff; margin-bottom: 4px;">Smarty91 Operations</h2>
            <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 20px;">Enter Staff Access Password</p>
            
            <input type="password" id="auth-pin-input" class="form-input" placeholder="Enter Password" maxlength="30" style="text-align: center; font-size: 18px; letter-spacing: 4px; margin-bottom: 14px;" />
            
            <div id="auth-error-msg" style="color: var(--accent-red); font-size: 11px; margin-bottom: 12px; display: none;"></div>

            <button id="auth-submit-btn" class="btn-primary">ACCESS OPERATIONS DESK</button>
            <div style="margin-top: 14px;">
                <a href="/" style="color: var(--text-muted); font-size: 11px; text-decoration: none;">← Back to Smarty91 Game</a>
            </div>
        </div>
    </div>

    <!-- Top Admin Header -->
    <header class="admin-header">
        <div class="header-brand">
            <!-- Sidebar Drawer Toggle Button -->
            <button id="sidebar-toggle-btn" style="background: transparent; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 4px; margin-right: 4px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; transition: all 0.15s ease;" title="Toggle Navigation Drawer">
                ☰
            </button>
            <div class="brand-logo">
                <img src="https://plain-apac-prod-public.komododecks.com/202608/30/R5mYT3Hlk72jXCVLqTOb/image.png" alt="Smarty91" />
            </div>
            <div class="brand-text-container">
                <div class="brand-title">Smarty91 Operations</div>
                <div class="brand-subtitle">Moderation & Financial Clearance</div>
            </div>
            <span style="display:inline-flex; align-items:center; gap:4px; font-size:9px; color:#10b981; font-weight:700; background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.2); padding:2px 6px; border-radius:4px; margin-left:4px; white-space:nowrap;">
                <span style="width:5px; height:5px; border-radius:50%; background:#10b981; box-shadow:0 0 5px #10b981;"></span>
                <span>Active</span>
            </span>
        </div>
        <div class="header-actions">
            <!-- Audio Alarm Quick Control -->
            <button id="admin-sound-toggle-btn" style="background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.25); color: #f59e0b; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap;" title="Toggle 5-6s Loud Beep Alarm for Requests">
                <span id="sound-icon">🔔</span>
                <span id="sound-status-text">Alarm ON</span>
            </button>
            <a href="/" class="btn-view-game">
                <span>🎮</span> Live Game
            </a>
            <button id="admin-logout-btn" style="background: transparent; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 3px; display: inline-flex; align-items: center; justify-content: center;" title="Logout">🚪</button>
        </div>
    </header>

    <!-- Drawer Overlay on Mobile -->
    <div class="drawer-overlay" id="drawer-overlay"></div>

    <!-- Collapsible Admin Layout Wrapper -->
    <div class="admin-layout-wrapper" id="admin-layout-wrapper">
        <!-- Sidebar Navigation Drawer -->
        <nav class="admin-nav" id="admin-nav">
            <button class="nav-item active" data-tab="cashier" id="nav-tab-cashier">
                <span class="nav-icon">
                    💰
                    <span id="cashier-badge" class="nav-badge" style="display:none;">0</span>
                </span>
                <span class="nav-label">Cashier</span>
            </button>
            <button class="nav-item" data-tab="exposure">
                <span class="nav-icon">🔥</span>
                <span class="nav-label">Live Bets</span>
            </button>
            <button class="nav-item" data-tab="users">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Players</span>
            </button>
        </nav>

        <!-- Main Dynamic Content Body -->
        <main class="admin-main">

            <!-- Compact Top Live Bets Exposure Box -->
            <div id="top-live-bets-box" style="margin-bottom: 12px;"></div>

        <!-- Mode Chips Selector (30s, 1m, 3m, 5m) -->
        <div class="mode-chips">
            <div class="mode-chip active" data-mode="30s">Smarty 30s</div>
            <div class="mode-chip" data-mode="1m">Smarty 1Min</div>
            <div class="mode-chip" data-mode="3m">Smarty 3Min</div>
            <div class="mode-chip" data-mode="5m">Smarty 5Min</div>
        </div>

        <!-- Dynamic Tab Views Container -->
        <div id="tab-view-container">
            <!-- Rendered by JS based on active tab -->
        </div>

    </main>
    </div>

    <!-- Help Explanation Modal -->
    <div id="help-explanation-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center; padding:16px;">
        <div style="background: var(--bg-card); border:1px solid var(--border-color); border-radius:5px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto; padding:18px; box-shadow:0 20px 40px rgba(0,0,0,0.8); position:relative;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:12px; margin-bottom:14px;">
                <div style="display:flex; align-items:center; gap:8px;">
                    <span id="help-modal-icon" style="font-size:22px;">❓</span>
                    <span id="help-modal-title" style="font-size:16px; font-weight:800; color:#fff;">System Explanation</span>
                </div>
                <button type="button" id="help-modal-close" style="background:rgba(255,255,255,0.1); border:none; color:#fff; width:28px; height:28px; border-radius:50%; font-weight:800; cursor:pointer;">✕</button>
            </div>
            <div id="help-modal-body" style="font-size:13px; color:var(--text-main); line-height:1.6;">
                <!-- Content injected dynamically -->
            </div>
            <button type="button" id="help-modal-ok-btn" class="btn-primary" style="margin-top:16px; width:100%; padding:10px; font-weight:800;">
                Understood & Close
            </button>
